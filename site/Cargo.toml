[package]
name = "murmint-site"
version = "0.1.0"
edition = "2021"
description = "Builds and serves the Murmint website, with Discord sign-in for the alpha"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
serde_json = "1"
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
